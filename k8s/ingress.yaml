apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: series-tracker-ingress
  namespace: series-tracker
  labels:
    app.kubernetes.io/name: series-tracker
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5173
